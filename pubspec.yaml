name: flutter_shop_app
description: "FlutterforShopware - Shopware 6 ile entegre Flutter mobil uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dynamic Widget - Alternative approach
  json_annotation: ^4.8.1

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.7
  flutter_riverpod: ^2.4.7

  # UI Components
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Navigation
  go_router: ^12.1.3

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.1
  
  # WebView
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.2
  webview_flutter_wkwebview: ^3.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
