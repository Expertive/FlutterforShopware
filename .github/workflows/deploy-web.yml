name: Build Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          SHOPWARE_BASE_URL: ${{ secrets.SHOPWARE_BASE_URL }}
          SHOPWARE_SALES_CHANNEL_ID: ${{ secrets.SHOPWARE_SALES_CHANNEL_ID }}
          MOBILE_APP_SECRET: ${{ secrets.MOBILE_APP_SECRET }}
        run: |
          # Prefer secrets; fall back to empty so local/org vars can also be used.
          : "${SHOPWARE_BASE_URL:?Set secret SHOPWARE_BASE_URL}"
          : "${SHOPWARE_SALES_CHANNEL_ID:?Set secret SHOPWARE_SALES_CHANNEL_ID}"
          : "${MOBILE_APP_SECRET:?Set secret MOBILE_APP_SECRET}"

          flutter build web --release --base-href=/ \
            --dart-define=SHOPWARE_BASE_URL="$SHOPWARE_BASE_URL" \
            --dart-define=SHOPWARE_SALES_CHANNEL_ID="$SHOPWARE_SALES_CHANNEL_ID" \
            --dart-define=MOBILE_APP_SECRET="$MOBILE_APP_SECRET"

      - name: Add custom domain CNAME
        run: echo "flutter.expertive.de" > build/web/CNAME

      - name: Add cache headers (Cloudflare Pages)
        run: |
          printf '%s\n' \
            '/*' \
            '  X-Content-Type-Options: nosniff' \
            '/index.html' \
            '  Cache-Control: no-cache, no-store, must-revalidate' \
            '/flutter_bootstrap.js' \
            '  Cache-Control: no-cache, no-store, must-revalidate' \
            '/flutter.js' \
            '  Cache-Control: no-cache, no-store, must-revalidate' \
            '/main.dart.js' \
            '  Cache-Control: public, max-age=3600, must-revalidate' \
            '/version.json' \
            '  Cache-Control: no-cache, no-store, must-revalidate' \
            > build/web/_headers

      - name: Verify main.dart.js is complete
        run: |
          SIZE=$(wc -c < build/web/main.dart.js)
          echo "main.dart.js size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "main.dart.js looks truncated"
            exit 1
          fi
          tail -c 120 build/web/main.dart.js

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      # Optional Cloudflare Pages deploy (set CLOUDFLARE_API_TOKEN + ACCOUNT_ID).
      # Secrets cannot be used directly in `if:`; map them to env first.
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare Pages (secrets not set)."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=flutter-expertive --commit-dirty=true
